name: update-gh-activity

on:
  workflow_dispatch:
  schedule:
    - cron: '*/60  * * *'  # Runs every 1 minute

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
